  description: >-
    The Monzo API is a REST interface over a user's Monzo account. It exposes
    accounts, balance, savings pots (with deposit/withdraw), transactions
    (list, retrieve, annotate with metadata, expand merchant), feed items,
    attachments, transaction receipts, and webhooks for real-time
    transaction.created notifications. Authentication is OAuth 2.0
    (authorization code grant) with Strong Customer Authentication approved in
    the Monzo mobile app; all requests carry a Bearer access token.
