aid: monzo
name: Monzo
description: >-
  Monzo is a UK-based digital challenger bank (Monzo Bank Ltd, FCA-authorised)
  offering current accounts, savings pots, joint accounts, business banking and
  lending through a mobile-first app. For developers, Monzo publishes a public
  REST API at api.monzo.com that lets a user build personal applications against
  their own Monzo account: listing accounts, reading balances, managing savings
  pots, retrieving and annotating transactions, uploading receipts and
  attachments, posting custom feed items into the app, and registering webhooks
  for real-time transaction notifications. Access uses OAuth 2.0 with Strong
  Customer Authentication (SCA) approved via push notification in the Monzo app.
  The API is intended for personal use and small groups of authorised users
  rather than large public applications.
